[project]
name = "enneai"
version = "0.1.0"
description = "EnneAI — AI assistant based on personality typologies"
authors = [
    { name = "Gl0wdy", email = "glowdyyk@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "aiogram>=3.30.0",
    "beanie>=2.2.0",
    "cryptography>=50.0.0",
    "ddgs>=9.0.0",
    "docchunker>=0.3.0",
    "fastembed>=0.8.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
    "trafilatura>=2.0.0",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"