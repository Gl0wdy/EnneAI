services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enneai-bot
    restart: unless-stopped

    env_file:
      - .env

    environment:
      QDRANT_URL: http://qdrant:6333

    depends_on:
      qdrant:
        condition: service_started

    volumes:
      - ./data:/app/data
      - ./models:/app/models

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enneai-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: